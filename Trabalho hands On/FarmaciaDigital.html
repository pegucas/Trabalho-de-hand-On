<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mente Leve - Farmácia Digital</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="Farmacia digital/FarmaciaDigital.css">
</head>

<body>

  <!-- Container do App -->
  <div class="app-container">

    <!-- Cabeçalho -->
    <header class="top-header">
      <div class="logo-text">
        <i class="bi bi-heart-pulse-fill"></i>
        Mente Leve
      </div>
      <div class="cart-icon-wrapper">
        <i class="bi bi-cart2 fs-4"></i>
        <span class="cart-badge">0</span>
      </div>
    </header>

    <!-- Título da Página -->
    <h1 class="fw-bold mb-4">Farmácia Digital</h1>

    <!-- Barra de Pesquisa -->
    <div class="search-bar">
      <i class="bi bi-search"></i>
      <input type="text" placeholder="Buscar medicamentos, itens...">
    </div>

    <!-- Categorias (Scroll Horizontal) -->
    <div class="categories-scroll">
      <div class="category-item">
        <div class="category-icon-box"><i class="bi bi-capsule"></i></div>
        <span class="category-name">Medicamentos</span>
      </div>
      <div class="category-item">
        <div class="category-icon-box"><i class="bi bi-droplet"></i></div>
        <span class="category-name">Higiene</span>
      </div>
      <div class="category-item">
        <div class="category-icon-box"><i class="bi bi-stars"></i></div>
        <span class="category-name">Beleza</span>
      </div>
      <div class="category-item">
        <div class="category-icon-box"><i class="bi bi-lightning-charge"></i></div>
        <span class="category-name">Suplementos</span>
      </div>
      <!-- Adicione mais se precisar -->
      <div class="category-item">
        <div class="category-icon-box"><i class="bi bi-bandaid"></i></div>
        <span class="category-name">Curativos</span>
      </div>
    </div>

    <!-- Grid de Produtos -->
    <div class="row g-3">

      <!-- Produto 1 -->
      <div class="col-6">
        <div class="product-card">
          <button class="btn-favorite"><i class="bi bi-suit-heart"></i></button>

          <div class="product-img-box">
            <!-- Coloque a tag <img> aqui depois -->
            <i class="bi bi-image"></i>
          </div>

          <div class="product-title">Novalgina</div>
          <div class="product-price">R$ 12,50</div>

          <div class="action-row">
            <a href="ProdutoEspecs.html" class="btn-add">Adicionar</a>
            <button class="btn-cart-outline"><i class="bi bi-cart-plus"></i></button>
          </div>
        </div>
      </div>

      <!-- Produto 2 -->
      <div class="col-6">
        <div class="product-card">
          <button class="btn-favorite"><i class="bi bi-suit-heart"></i></button>

          <div class="product-img-box">
            <i class="bi bi-image"></i>
          </div>

          <div class="product-title">Shampoo</div>
          <div class="product-price">R$ 33,30</div>

          <div class="action-row">
            <a href="ProdutoEspecs.html" class="btn-add">Adicionar</a>
            <button class="btn-cart-outline"><i class="bi bi-cart-plus"></i></button>
          </div>
        </div>
      </div>

      <!-- Produto 3 -->
      <div class="col-6">
        <div class="product-card">
          <button class="btn-favorite"><i class="bi bi-suit-heart"></i></button>

          <div class="product-img-box">
            <i class="bi bi-image"></i>
          </div>

          <div class="product-title">Vitamina C</div>
          <div class="product-price">R$ 45,90</div>

          <div class="action-row">
            <a href="ProdutoEspecs.html" class="btn-add">Adicionar</a>
            <button class="btn-cart-outline"><i class="bi bi-cart-plus"></i></button>
          </div>
        </div>
      </div>

      <!-- Produto 4 -->
      <div class="col-6">
        <div class="product-card">
          <button class="btn-favorite"><i class="bi bi-suit-heart"></i></button>

          <div class="product-img-box">
            <i class="bi bi-image"></i>
          </div>

          <div class="product-title">Hidratante</div>
          <div class="product-price">R$ 28,00</div>

          <div class="action-row">
            <a href="ProdutoEspecs.html" class="btn-add">Adicionar</a>
            <button class="btn-cart-outline"><i class="bi bi-cart-plus"></i></button>
          </div>
        </div>
      </div>

    </div> <!-- Fim Grid -->
  </div> <!-- Fim App Container -->

  <!-- Menu Inferior (Console) -->
  <nav class="footer-console d-flex justify-content-around align-items-center">
    <a href="index.html" class="nav-item-console"><i class="bi bi-house-door-fill"></i></a>
    <a href="FarmaciaDigital.html" class="nav-item-console"><i class="bi bi-compass"></i></a>

    <a href="carrinho.html" class="console-main-btn text-decoration-none">
      <div class="main-btn-circle">
        <i class="bi bi-cart-fill fs-3"></i>
      </div>
    </a>

    <a href="RemediosCaseiros.html" class="nav-item-console"><i class="bi bi-bag-check"></i></a>
    <a href="Atendimento.html" class="nav-item-console"><i class="bi bi-robot"></i></a>
  </nav>

</body>

</html>
