<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mente Leve - Carrinho</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="Carrinho/carrinho.css">

</head>

<body>

  <div class="app-container">

    <!-- Cabeçalho -->
    <header class="top-header">
      <!-- Botão Voltar (Ajuste o href para a página da farmácia) -->
      <a href="FarmaciaDigital.html" class="btn-back">
        <i class="bi bi-chevron-left"></i>
      </a>

      <div class="header-title">
        Carrinho de Compras <i class="bi bi-cart3"></i>
      </div>
    </header>

    <div class="cart-section-title">Meu Carrinho</div>

    <!-- Lista de Itens do Carrinho -->
    <div class="cart-items-container">

      <!-- Item 1 -->
      <div class="cart-item">
        <button class="btn-remove"><i class="bi bi-x"></i></button>

        <div class="item-img-box">
          <i class="bi bi-image"></i>
        </div>

        <div class="item-info">
          <div class="item-title">Dorflex</div>
          <div class="item-category">Saúde</div>
          <div class="item-price">R$ 39,90</div>
        </div>

        <div class="quantity-control mt-4">
          <button class="qty-btn">-</button>
          <span class="qty-value">1</span>
          <button class="qty-btn">+</button>
        </div>
      </div>

      <!-- Item 2 -->
      <div class="cart-item">
        <button class="btn-remove"><i class="bi bi-x"></i></button>

        <div class="item-img-box">
          <i class="bi bi-image"></i>
        </div>

        <div class="item-info">
          <div class="item-title">Whey Protein</div>
          <div class="item-category">Saúde</div>
          <div class="item-price">R$ 51,00</div>
        </div>

        <div class="quantity-control mt-4">
          <button class="qty-btn">-</button>
          <span class="qty-value">1</span>
          <button class="qty-btn">+</button>
        </div>
      </div>

      <!-- Item 3 -->
      <div class="cart-item">
        <button class="btn-remove"><i class="bi bi-x"></i></button>

        <div class="item-img-box">
          <i class="bi bi-image"></i>
        </div>

        <div class="item-info">
          <div class="item-title">Chá Verde</div>
          <div class="item-category">Saúde</div>
          <div class="item-price">R$ 16,90</div>
        </div>

        <div class="quantity-control mt-4">
          <button class="qty-btn">-</button>
          <span class="qty-value">1</span>
          <button class="qty-btn">+</button>
        </div>
      </div>

    </div> <!-- Fim da Lista de Itens -->

    <!-- Resumo e Checkout -->
    <div class="checkout-area">
      <div class="total-row">
        <span class="total-label">Total</span>
        <span class="total-value">R$ 107,80</span>
      </div>

      <button class="btn-checkout">Finalizar Compra</button>

      <!-- Ícones de Pagamento -->
      <div class="payment-methods">
        <i class="bi bi-credit-card-fill"></i>
        <i class="bi bi-cash"></i>
        <i class="bi bi-qr-code-scan"></i>
      </div>
    </div>

  </div> <!-- Fim do App Container -->

</body>

</html>
