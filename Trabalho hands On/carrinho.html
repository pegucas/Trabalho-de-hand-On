<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mente Leve - Carrinho</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <style>
    /* =========================================
       CONFIGURAÇÕES GERAIS E FUNDO
       ========================================= */
    body {
      background: radial-gradient(circle at top, #111836 0%, #050814 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .app-container {
      max-width: 480px; /* Mantém proporção de celular no PC */
      margin: 0 auto;
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    /* =========================================
       CABEÇALHO COM BOTÃO VOLTAR
       ========================================= */
    .top-header {
      display: flex;
      align-items: center;
      margin-bottom: 30px;
      position: relative;
    }

    .btn-back {
      color: #00d2ff;
      font-size: 1.5rem;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .btn-back:hover {
      opacity: 0.8;
      color: #00d2ff;
    }

    .header-title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-title i {
      color: #a855f7;
    }

    /* =========================================
       ITENS DO CARRINHO
       ========================================= */
    .cart-section-title {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .cart-items-container {
      flex: 1; /* Ocupa o espaço disponível e empurra o total para baixo */
      overflow-y: auto;
      padding-bottom: 20px;
    }

    /* Esconde a barra de rolagem */
    .cart-items-container::-webkit-scrollbar {
      display: none;
    }
    .cart-items-container {
      scrollbar-width: none;
    }

    .cart-item {
      background: rgba(23, 19, 58, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      position: relative;
    }

    .btn-remove {
      position: absolute;
      top: 10px;
      right: 15px;
      color: #6c7a9c;
      background: none;
      border: none;
      font-size: 1rem;
      padding: 0;
    }

    .btn-remove:hover {
      color: #ff4757;
    }

    .item-img-box {
      width: 60px;
      height: 60px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 15px;
      flex-shrink: 0;
    }

    .item-img-box i {
      font-size: 1.8rem;
      color: rgba(255, 255, 255, 0.2);
    }

    .item-info {
      flex-grow: 1;
    }

    .item-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .item-category {
      font-size: 0.75rem;
      color: #6c7a9c;
      margin-bottom: 5px;
    }

    .item-price {
      font-size: 0.9rem;
      color: #00d2ff;
      font-weight: bold;
    }

    /* Controle de Quantidade */
    .quantity-control {
      display: flex;
      align-items: center;
      background: rgba(10, 11, 28, 0.8);
      border-radius: 20px;
      padding: 2px 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .qty-btn {
      background: none;
      border: none;
      color: #a0abc0;
      font-size: 1rem;
      padding: 0 5px;
    }

    .qty-btn:hover {
      color: #fff;
    }

    .qty-value {
      font-size: 0.85rem;
      font-weight: 600;
      margin: 0 10px;
    }

    /* =========================================
       ÁREA DE TOTAL E FINALIZAR (RODAPÉ)
       ========================================= */
    .checkout-area {
      background: rgba(23, 19, 58, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 20px;
      margin-top: auto;
      backdrop-filter: blur(10px);
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .total-label {
      font-size: 1.1rem;
      color: #a0abc0;
    }

    .total-value {
      font-size: 1.4rem;
      font-weight: bold;
      color: #fff;
    }

    .btn-checkout {
      background: linear-gradient(90deg, #0099ff 0%, #a855f7 100%);
      color: white;
      border: none;
      border-radius: 15px;
      padding: 12px;
      width: 100%;
      font-size: 1rem;
      font-weight: 600;
      transition: opacity 0.3s;
    }

    .btn-checkout:hover {
      opacity: 0.9;
    }

    .payment-methods {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 15px;
      color: #6c7a9c;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Cabeçalho -->
    <header class="top-header">
      <!-- Botão Voltar (Ajuste o href para a página da farmácia) -->
      <a href="FarmaciaDigital.html" class="btn-back">
        <i class="bi bi-chevron-left"></i>
      </a>
      
      <div class="header-title">
        Carrinho de Compras <i class="bi bi-cart3"></i>
      </div>
    </header>

    <div class="cart-section-title">Meu Carrinho</div>

    <!-- Lista de Itens do Carrinho -->
    <div class="cart-items-container">
      
      <!-- Item 1 -->
      <div class="cart-item">
        <button class="btn-remove"><i class="bi bi-x"></i></button>
        
        <div class="item-img-box">
          <i class="bi bi-image"></i>
        </div>
        
        <div class="item-info">
          <div class="item-title">Dorflex</div>
          <div class="item-category">Saúde</div>
          <div class="item-price">R$ 39,90</div>
        </div>
        
        <div class="quantity-control mt-4">
          <button class="qty-btn">-</button>
          <span class="qty-value">1</span>
          <button class="qty-btn">+</button>
        </div>
      </div>

      <!-- Item 2 -->
      <div class="cart-item">
        <button class="btn-remove"><i class="bi bi-x"></i></button>
        
        <div class="item-img-box">
          <i class="bi bi-image"></i>
        </div>
        
        <div class="item-info">
          <div class="item-title">Whey Protein</div>
          <div class="item-category">Saúde</div>
          <div class="item-price">R$ 51,00</div>
        </div>
        
        <div class="quantity-control mt-4">
          <button class="qty-btn">-</button>
          <span class="qty-value">1</span>
          <button class="qty-btn">+</button>
        </div>
      </div>

      <!-- Item 3 -->
      <div class="cart-item">
        <button class="btn-remove"><i class="bi bi-x"></i></button>
        
        <div class="item-img-box">
          <i class="bi bi-image"></i>
        </div>
        
        <div class="item-info">
          <div class="item-title">Chá Verde</div>
          <div class="item-category">Saúde</div>
          <div class="item-price">R$ 16,90</div>
        </div>
        
        <div class="quantity-control mt-4">
          <button class="qty-btn">-</button>
          <span class="qty-value">1</span>
          <button class="qty-btn">+</button>
        </div>
      </div>

    </div> <!-- Fim da Lista de Itens -->

    <!-- Resumo e Checkout -->
    <div class="checkout-area">
      <div class="total-row">
        <span class="total-label">Total</span>
        <span class="total-value">R$ 107,80</span>
      </div>
      
      <button class="btn-checkout">Finalizar Compra</button>
      
      <!-- Ícones de Pagamento -->
      <div class="payment-methods">
        <i class="bi bi-credit-card-fill"></i>
        <i class="bi bi-cash"></i>
        <i class="bi bi-qr-code-scan"></i>
      </div>
    </div>

  </div> <!-- Fim do App Container -->

</body>
</html>
