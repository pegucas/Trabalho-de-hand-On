<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mente Leve - Login</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- Estilos Customizados -->
  <link rel="stylesheet" href="login/login.css">
  <!--Fonte-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono&display=swap" rel="stylesheet">
</head>
<body>

  <div class="main-container d-flex align-items-center justify-content-center min-vh-100 p-3">
    <div class="card card-custom p-4 p-md-5 text-center shadow-lg">
      
      <!-- Espaço Reservado para o Logo -->
      <div class="logo-container mb-4 mx-auto d-flex align-items-center justify-content-center">
        <!-- Substitua a tag abaixo pela sua imagem quando quiser:
             <img src="caminho-da-sua-imagem.png" alt="Mente Leve Logo" class="img-fluid"> 
        -->
        <img class="bi bi-heart-pulse-fill logo-container" src="login/image_4838ed41-removebg-preview.png" alt="logo">
      </div>

      <!-- Título do App -->
      <h1 class="app-title mb-4">Login</h1>

      
      <!-- Formulário de Login -->
      <form action="index.html" method="get" class="login-form">
        <!-- Campo E-mail ou CPF -->
        <div class="mb-3">
          <input type="text" class="form-control form-control-custom" placeholder="E-mail ou CPF" required>
        </div>

        <!-- Campo Senha -->
        <div class="mb-4 position-relative">
          <input type="password" class="form-control form-control-custom pe-5" placeholder="Senha" required>
          <i class="bi bi-eye-slash-fill password-icon position-absolute top-50 end-0 translate-middle-y me-3"></i>
        </div>

        <!-- Botão Entrar -->
        <button type="submit" class="btn btn-gradient w-50 py-2 mb-3">Entrar</button>
      </form>

      <!-- Link Criar Conta -->
      <div class="mb-4">
        <a href="#" class="link-custom">Criar Conta</a>
      </div>
        </a>
      </div>

    </div>
  </div>

</body>
</html>
